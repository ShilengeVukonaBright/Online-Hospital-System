<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="..." crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Patient Dashboard</title>
</head>
<body>
    <nav>
        <h1>Patient Dashboard</h1>

    </nav>
    <main>
        <h2>Welcome back. Here is an overview of your appointments.</h2>
        <div class="main-container">
            <div class="Upcoming">
                <h3>Upcoming</h3>
                <span>Details and status</span>
            </div>
            <div class="Completed">
                <h3>Completed</h3>
                <span>Details and status</span>
            </div>
            <div class="Cancelled">
                <h3>Cancelled</h3>
                <span>Details and status</span>
            </div>

        </div>
        <button><a href="/BookAppointment.html">Book New Appointment</a></button>

        <footer>
            <div class="Up">
                <h3>Upcoming appointment</h3>
                <span>Date - Time - Department - Status - View Details</span>
            </div>
        </footer>
    </main>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'poppins',sans-serif;
        }
        nav{
             background:#EFF6FF;
             line-height: 80px;
             h1{
             margin-left: 26px;
             font-size: 1.6rem;
             }

        }
        main{
            h2{
                color:#64748B;
                margin: 26px;
                font-size: 1rem;
                margin-top: 40px;
                font-weight: 500;
            }
            .main-container{
                display: grid;
                grid-template-columns: 1fr 1fr 1fr;
                padding: 20px;
                gap: 20px;
                line-height: 40px;
                
            }
            .Upcoming ,.Completed ,.Cancelled{
                background:#F8FAFC;
                border-radius: 6px;
                text-align: center;
                cursor: pointer;
                border: 1px solid #64748B;
                span{
                    font-size: 0.8rem;
                    color:#64748B;
                }
            }
            .Upcoming:hover ,.Completed:hover ,.Cancelled:hover{
                background:#64748B;
                color:white;
                span{
                    color: #EFF6FF;
                }

            }
            button a{
                text-decoration: none;
                color: white;
                font-weight: bold;
            

            }
            button{
                margin-left: 20px;
                min-width: 420px;
                height: 40px;
                background:#2563EB; 
                border: none;
                border-radius: 5px;
                cursor: pointer;

            }
            button:hover{
                 background:rgba(0,0,100,0.9);
            }
        }
        footer{
            
            margin-top: 120px;
        
        }
        .Up{
            background: #F8FAFC;
            margin: 60px;
            padding: 10px;
            border: 1px solid #64748B;
            border-radius: 5px;
            cursor: pointer;
            h3{
                margin-bottom: 5px;
                font-size: 1rem;
            }
            span{
                color: #64748B;
                font-size: 0.9rem;
            }

        }
        .Up:hover{
            background: #64748B;
            color: white;
            span{
                color: #F8FAFC;
            }
        }
    </style>
</body>
</html>
