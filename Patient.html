<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

</head>
<body>
    <nav>
       <h1>Create Your  Account</h1>
    </nav>
      <main>
        <h2>Register to book and manage hospital appointments.</h2>
        <form action="Register.html" method="post">
            <label for="name">Full Name</label><br>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" placeholder="name@example.com" required><br><br>

            <label for="password">Phone number</label><br>
            <input type="number" id="number" name="phone" placeholder="Enter your phone number" required><br><br>

            <label for="confirm-password">Password</label><br>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Create a password" required><br><br>

            <input type="submit" id="submit" value="Create Account">
        </form>


    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:'poppins', sans-serif;
        }
        nav{
            background:#DBEAFE;
            padding: 20px;
        }
        main{
            display: flex;
            flex-direction: column;
            align-items: start;
            margin-left: 20px;
            h2{
                padding:10px 20px;
                font-size: 1.2rem;
                margin-top: 15px;
                margin-bottom: 10px;
                font-weight: 300;
                color:#64748B;
            }
            label{
                font-weight: bold;
                font-size: 1.1rem;
                            }
            input{
                padding:10px 15px;
                font-size: 1rem;
                border-radius: 6px;
                border: 2px solid grey;
                width: 400px;
                height: 35px;
            }
            input#submit{
                background:#2563EB ;
                border: none;
                width: 350px;
                color: white;
                font-weight: bold;
                height: 40px;
            }
            input#submit:hover{
                cursor: pointer;
                background: #64748B;
            }
            form{
                gap:20px;
            }
        }
    </style>
</body>
</html>
